  <!-- 
    This is the "lightbox" - a popup box that shows a bigger version
    of the image when you click on it. It starts off hidden.
  -->
<!-- Lightbox -->
<!-- Lightbox -->

<div class="lightbox" id="lightbox">

    <!-- Close Button -->

    <span class="close-btn" id="closeBtn">&times;</span>


    <!-- Previous Button -->

    <button class="prev-btn" id="prevBtn" aria-label="Previous image">
        &#10094;
    </button>


    <!-- Enlarged Image -->

    <img src="" alt="Enlarged view" id="lightboxImg">


    <!-- Next Button -->

    <button class="next-btn" id="nextBtn" aria-label="Next image">
        &#10095;
    </button>

</div>
